name: Windows Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Check and build frontend
        run: npm run build

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Build Windows EXE and NSIS installer
        run: npm run tauri build -- --bundles nsis

      - name: Verify application EXE
        shell: pwsh
        run: |
          if (-not (Test-Path 'src-tauri/target/release/haven-walls.exe')) {
            throw 'Native Windows executable was not generated'
          }

      - name: Upload test builds
        uses: actions/upload-artifact@v4
        with:
          name: haven-walls-windows-pr
          path: |
            src-tauri/target/release/haven-walls.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
