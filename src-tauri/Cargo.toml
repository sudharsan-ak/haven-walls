[package]
name = "haven-walls"
version = "0.1.0"
description = "Haven Walls: local-first Windows wallpaper manager"
edition = "2024"

[lib]
name = "haven_walls_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Windows-only WebView2 context menu bindings. Both versions already appear
# in Cargo.lock as dependencies of Tauri/Wry; keep them pinned for COM ABI parity.
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_System_Com"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
